spring:
  application:
    name: file-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://127.0.0.1:27017/campus_trade}
      auto-index-creation: true
    redis:
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 50MB

server:
  port: ${SERVER_PORT:8087}

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-local-dev-jwt-secret-1234567890}

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173}
  upload-dir: ${APP_UPLOAD_DIR:./data/files}
  public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:${server.port}}
